name: flutter_task
description: "Lokinter"

publish_to: 'none'


version: 1.0.0+2

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # data layer + offline 
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # image caching + loading placeholders
  cached_network_image: ^3.4.1
  # the cache manager behind cached_network_image — emptied on logout
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  # lottie illustrations (login, empty states)
  lottie: ^3.1.3
  # circular country flags for the local deal indicator
  country_flags: ^3.1.0
  # transporter business-document uploads on register
  file_picker: ^8.1.4
  # real-time chat over Pusher Channels (Laravel Echo backend)
  pusher_channels_flutter: ^2.4.0
  # in-app Stripe escrow payments (sender hold + traveler guarantee),
  # matching the website's card-element confirm flow
  flutter_stripe: ^11.3.0
  # deal QR code the receiver scans to confirm delivery
  qr_flutter: ^4.1.0
  # avatar + product-picture uploads (camera/gallery)
  image_picker: ^1.1.2
  # KYC / Stripe Connect onboarding open in the system browser
  url_launcher: ^6.3.1
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  device_info_plus: ^12.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # generates the launcher icons for both platforms from assets/images/logo.png
  # — run `dart run flutter_launcher_icons` after changing the logo
  flutter_launcher_icons: ^0.14.4

# Launcher icons. The Android adaptive icon insets the logo so the system's
# circular/squircle mask doesn't clip it, and iOS gets its alpha stripped
# because App Store Connect rejects icons with transparency.
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 18
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/data/
    - assets/data/cities/
