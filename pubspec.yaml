name: flutter_task
description: "Flutter task"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # data layer + offline 
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # image caching + loading placeholders
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  # lottie illustrations (login, empty states)
  lottie: ^3.1.3
  # circular country flags for the local deal indicator
  country_flags: ^3.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
